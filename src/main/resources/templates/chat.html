<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${profile.name} + ' | Chat'">
         Chat
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 105, 180, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(255, 220, 80, 0.12),
                    transparent 30%
                ),
                #fff8fc;

            color: #3a2030;

            display: flex;

            flex-direction: column;
        }

        /* HEADER */

        .header {

            height: 70px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            padding: 0 15px;

            gap: 12px;

            background: rgba(255,255,255,0.9);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid #f3d6e4;

            box-shadow:
                0 3px 15px rgba(220,80,140,0.06);
        }

        .back {

            text-decoration: none;

            color: #e83f89;

            font-size: 27px;

            font-weight: 700;
        }

        .profile {

            flex: 1;

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .avatar {

            width: 43px;

            height: 43px;

            border-radius: 50%;

            overflow: hidden;

            background: #ffd9e9;

            flex-shrink: 0;
        }

        .avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }

        .avatar-placeholder {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;
        }

        .profile-name {

            font-size: 15px;

            font-weight: 800;

            color: #d9347d;
        }

        .status {

            margin-top: 2px;

            font-size: 10px;

            color: #2e9b62;
        }

        .video-call {

            width: 44px;

            height: 44px;

            border: none;

            border-radius: 50%;

            background: #fff3b5;

            color: #806500;

            font-size: 19px;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(255,205,60,0.15);
        }

        /* COINS */

        .coin-bar {

            padding: 9px 15px;

            background: #fff4bd;

            color: #806500;

            font-size: 12px;

            font-weight: 800;

            text-align: center;

            border-bottom: 1px solid #f2df98;
        }

        /* CHAT AREA */

        .messages {

            flex: 1;

            overflow-y: auto;

            padding: 20px 14px;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .message {

            max-width: 78%;

            padding: 11px 14px;

            border-radius: 18px;

            font-size: 14px;

            line-height: 1.45;

            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-message {

            align-self: flex-start;

            background: white;

            border: 1px solid #f3d7e4;

            border-bottom-left-radius: 5px;

            box-shadow:
                0 4px 15px rgba(220,80,140,0.05);
        }

        .user-message {

            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #ff4b98,
                    #ff78b4
                );

            color: white;

            border-bottom-right-radius: 5px;

            box-shadow:
                0 5px 15px rgba(255,70,145,0.16);
        }

        .typing {

            display: none;

            align-self: flex-start;

            padding: 10px 15px;

            background: white;

            border: 1px solid #f3d7e4;

            border-radius: 18px;

            color: #d9347d;

            font-size: 12px;
        }

        /* INPUT */

        .input-area {

            flex-shrink: 0;

            padding: 10px;

            display: flex;

            gap: 8px;

            background: rgba(255,255,255,0.92);

            backdrop-filter: blur(15px);

            border-top: 1px solid #f3d6e4;
        }

        .message-input {

            flex: 1;

            height: 48px;

            border: 1px solid #f0cada;

            border-radius: 25px;

            padding: 0 16px;

            outline: none;

            font-size: 14px;

            color: #3a2030;

            background: #fffafd;
        }

        .message-input:focus {

            border-color: #f06ca5;

            box-shadow:
                0 0 0 3px rgba(240,108,165,0.1);
        }

        .send-btn {

            width: 48px;

            height: 48px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff3f91,
                    #ff78b4
                );

            color: white;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(255,63,145,0.2);
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .message {
                max-width: 84%;
            }

            .header {
                height: 64px;
            }

            .messages {
                padding: 15px 10px;
            }

        }

    </style>
    
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <a th:href="@{'/profile/' + ${profile.id}}"
       class="back">
        ←
    </a>


    <div class="profile">

        <div class="avatar">

            <img
                th:if="${profile.profileImage != null
                         and !profile.profileImage.isEmpty()}"
                th:src="@{'/api/image/' + ${profile.profileImage}}"
                th:alt="${profile.name}"
                onerror="this.parentElement.innerHTML='👩'">

            <div
                th:unless="${profile.profileImage != null
                            and !profile.profileImage.isEmpty()}"
                class="avatar-placeholder">
                👩
            </div>

        </div>


        <div>

            <div class="profile-name"
                 th:text="${profile.name}">
                Sofia
            </div>

            <div class="status">
                🟢 Online
            </div>

        </div>

    </div>


    <button class="video-call">
        📹
    </button>

</header>


<!-- COINS -->

<div class="coin-bar">

    🪙 0 Coins

</div>


<!-- MESSAGES -->

<main class="messages"
      id="messages"
      th:attr="data-profile-id=${profile.id}">


    <div class="message ai-message">

        Hey! 😊
        I'm really happy to see you here.

    </div>


    <span th:text="|I'm ${profile.name}. What would you like to talk about? 💗|"></span>


    <div class="message typing"
         id="typing">

        typing...

    </div>


</main>


<!-- INPUT -->

<form class="input-area"
      id="chatForm">

    <input
        type="text"
        id="messageInput"
        class="message-input"
        placeholder="Type a message..."
        autocomplete="off">

    <button
        type="submit"
        class="send-btn">

        ➤

    </button>

</form>


<script>

    const form =
        document.getElementById("chatForm");

    const input =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const videoCallButton =
        document.querySelector(".video-call");

    const profileId =
        messages.dataset.profileId;


    // =========================
    // 🪙 UPDATE COIN DISPLAY
    // =========================

    async function loadCoinBalance() {

        try {

            const response =
                await fetch("/api/user/coins");

            const data =
                await response.json();

            console.log(
                "🪙 Current coins:",
                data
            );

            if (data.loggedIn) {

                document.querySelector(".coin-bar")
                    .innerText =
                    "🪙 " +
                    data.coins.toLocaleString() +
                    " Coins";
            }

        } catch (error) {

            console.error(
                "❌ Failed to load coins:",
                error
            );
        }
    }


    // =========================
    // 💬 SEND MESSAGE
    // =========================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const text =
                input.value.trim();

            if (text === "") {
                return;
            }


            // Prevent double clicking

            const sendButton =
                form.querySelector(".send-btn");

            sendButton.disabled = true;


            try {

                // =========================
                // SEND TO BACKEND
                // =========================

                const response =
                    await fetch(
                        "/api/chat/send",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                "profileId=" +
                                encodeURIComponent(profileId) +
                                "&message=" +
                                encodeURIComponent(text)
                        }
                    );


                const data =
                    await response.json();

                console.log(
                    "💬 Chat response:",
                    data
                );


                // =========================
                // ❌ NOT ENOUGH COINS
                // =========================

                if (!data.success) {

                    if (
                        data.error ===
                        "Not enough coins"
                    ) {

                        const popupBalance =
                            document.getElementById(
                                "popupCoinBalance"
                            );

                        if (popupBalance) {

                            popupBalance.innerText =
                                data.coins.toLocaleString();
                        }

                        openRechargePopup();

                    } else {

                        alert(
                            data.error ||
                            "Unable to send message."
                        );
                    }

                    return;
                }


                // =========================
                // 🪙 UPDATE BALANCE
                // =========================

                document.querySelector(".coin-bar")
                    .innerText =
                    "🪙 " +
                    data.coins.toLocaleString() +
                    " Coins";


                // =========================
                // 👤 SHOW USER MESSAGE
                // =========================

                const userMessage =
                    document.createElement("div");

                userMessage.className =
                    "message user-message";

                userMessage.innerText =
                    text;

                messages.appendChild(
                    userMessage
                );


                // Clear input

                input.value = "";


                // Scroll down

                messages.scrollTop =
                    messages.scrollHeight;


                console.log(
                    "🪙 100 coins deducted."
                );


                // =========================
                // 🤖 AI GIRL TYPING
                // =========================

                const typing =
                    document.getElementById("typing");

                typing.style.display = "block";

                messages.scrollTop =
                    messages.scrollHeight;


                // Wait 1 second

                await new Promise(resolve =>
                    setTimeout(resolve, 1000)
                );


                // =========================
                // 🤖 SHOW AI REPLY
                // =========================

                typing.style.display = "none";

                const aiMessage =
                    document.createElement("div");

                aiMessage.className =
                    "message ai-message";

                aiMessage.innerText =
                    data.reply ||
                    "arey yaar kya kar rahe ho? 😘";

                messages.appendChild(
                    aiMessage
                );


                messages.scrollTop =
                    messages.scrollHeight;


            } catch (error) {

                console.error(
                    "❌ Chat error:",
                    error
                );

                alert(
                    "Unable to send message."
                );

            } finally {

                sendButton.disabled = false;
            }

        }
    );


    // =========================
    // 📹 VIDEO CALL
    // =========================

    videoCallButton.addEventListener(
        "click",
        async function() {

            console.log(
                "📹 Chat video call clicked"
            );


            try {

                const response =
                    await fetch(
                        "/api/video-call/start/" +
                        profileId,
                        {
                            method: "POST"
                        }
                    );


                const data =
                    await response.json();

                console.log(
                    "📹 Video call response:",
                    data
                );


                // =========================
                // ❌ NOT ENOUGH COINS
                // =========================

                if (!data.success) {

                    const popupBalance =
                        document.getElementById(
                            "popupCoinBalance"
                        );

                    if (popupBalance) {

                        popupBalance.innerText =
                            data.coins.toLocaleString();
                    }

                    openRechargePopup();

                    return;
                }


                // =========================
                // 🪙 UPDATE BALANCE
                // =========================

                document.querySelector(".coin-bar")
                    .innerText =
                    "🪙 " +
                    data.coins.toLocaleString() +
                    " Coins";


                console.log(
                    "🪙 1,500 coins deducted."
                );


                // =========================
                // 🎥 OPEN VIDEO CALL
                // =========================

                window.location.href =
                    "/video-call/" +
                    profileId +
                    "?sessionId=" +
                    data.sessionId;

            } catch (error) {

                console.error(
                    "❌ Video call error:",
                    error
                );

                alert(
                    "Unable to start video call."
                );
            }

        }
    );


    // =========================
    // 🪙 LOAD BALANCE
    // =========================

    loadCoinBalance();

</script>

	    <!-- Recharge Popup -->
    <div th:replace="~{fragments/recharge-popup :: rechargePopup}"></div>

</body>
</html>
