<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quick Login | AI Video Chat</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 105, 180, 0.30),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(255, 220, 80, 0.18),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #fff5fa,
                    #ffe1ef,
                    #ffffff
                );

            color: #3a2030;
        }

        /* Main login container with image */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 430px;
            z-index: 2;
            position: relative;
            margin: auto;
        }

        /* Collage image section - removed */
        .collage-section {
            display: none;
        }

        /* Floating circles */

        .bubble {
            position: absolute;
            border-radius: 50%;
            animation: float 7s ease-in-out infinite;
        }

        .bubble.one {
            width: 110px;
            height: 110px;

            background: rgba(255, 105, 180, 0.22);

            top: 8%;
            left: 5%;
        }

        .bubble.two {
            width: 70px;
            height: 70px;

            background: rgba(255, 220, 80, 0.30);

            bottom: 12%;
            right: 8%;

            animation-delay: 2s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-22px);
            }

        }

        /* Card */

        .login-card {

            position: relative;
            z-index: 2;

            width: min(100%, 430px);

            padding: 38px 28px;

            background: rgba(255, 255, 255, 0.78);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 30px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(255, 76, 150, 0.18);

            animation: appear 0.7s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Back button */

        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #e83f89;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        /* Header with logo */

        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 4px 12px rgba(232, 63, 137, 0.2);
        }

        .icon {

            width: 100px;
            height: 100px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            box-shadow:
                0 12px 28px rgba(255, 63, 145, 0.30);

            animation: pulse 2.5s infinite;
            
            overflow: hidden;
        }

        @keyframes pulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

        }

        h1 {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            color: #e83f89;

            margin-bottom: 8px;
        }

        .description {

            text-align: center;

            color: #79566a;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* Form */

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 700;

            color: #5c3d4d;
        }

        .input-group {

            margin-bottom: 18px;
        }

        input {

            width: 100%;

            height: 54px;

            padding: 0 17px;

            border-radius: 16px;

            border: 1px solid #f3c5da;

            background: rgba(255, 255, 255, 0.85);

            outline: none;

            font-size: 15px;

            color: #3a2030;

            transition: 0.25s;
        }

        input:focus {

            border-color: #ff4f9a;

            box-shadow:
                0 0 0 4px rgba(255, 79, 154, 0.10);
        }

        /* Login button */

        .login-button {

            width: 100%;

            height: 56px;

            border: none;

            border-radius: 17px;

            margin-top: 5px;

            background:
                linear-gradient(
                    135deg,
                    #ff3f91,
                    #ff78b4
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(255, 63, 145, 0.25);

            transition: 0.3s;
        }

        .login-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(255, 63, 145, 0.35);
        }

        .login-button:active {

            transform: scale(0.97);
        }

        /* Notice */

        .notice {

            margin-top: 22px;

            padding: 12px;

            border-radius: 14px;

            background: #fff5c7;

            color: #806500;

            text-align: center;

            font-size: 12px;

            line-height: 1.5;
        }

        .footer {

            text-align: center;

            margin-top: 20px;

            color: #a48b99;

            font-size: 11px;
        }

        @media (max-width: 480px) {

            .login-card {

                padding: 32px 22px;

                border-radius: 27px;
            }

            h1 {

                font-size: 27px;
            }

            input {

                height: 56px;
            }

            .login-button {

                height: 58px;
            }

            .login-container {
                flex-direction: column;
                gap: 20px;
            }

            .collage-section {
                display: flex;
                max-width: 100%;
                margin-bottom: 10px;
            }

            .collage-image {
                max-height: 300px;
            }

        }

    </style>

</head>

<body>

    <div class="bubble one"></div>
    <div class="bubble two"></div>

    <div class="login-container">

        <!-- Login Card -->
        <main class="login-card">

        <a href="/" class="back">
            ← Back
        </a>

        <div class="icon">
            <img src="/static/images/logo.jpeg" 
                 alt="DateVibe" 
                 style="width: 100px; height: 100px; object-fit: cover; border-radius: 22px;">
        </div>

        <h1>
            Quick Login
        </h1>

        <p class="description">
            Enter your name and age to start
            your chat with your favorite companion .
        </p>

        <form action="/quick-login" method="post">

            <div class="input-group">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    maxlength="30"
                    required>

            </div>


            <div class="input-group">

                <label for="age">
                    Your Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="18"
                    max="100"
                    required>

            </div>


            <button
                type="submit"
                class="login-button">

                ✨ ENTER APP

            </button>

        </form>


        <div class="notice">

            💛 This app is for users aged 18+
            and for socializing.

        </div>


        <p class="footer">

            Your experience starts here 💗

        </p>

        </main>

    </div>

</body>

</html>
