<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chats | Deedi</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 105, 180, 0.18),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(255, 220, 80, 0.12),
                    transparent 28%
                ),
                #fff8fc;

            color: #3a2030;

            padding-bottom: 80px;
        }


        /* HEADER */

        .header {

            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            background: rgba(255,255,255,0.9);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid #f8d5e5;

            position: sticky;
            top: 0;

            z-index: 10;
        }


        .brand {

            display: flex;
            align-items: center;

            gap: 9px;

            font-size: 18px;

            font-weight: 800;

            color: #e83f89;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            object-fit: contain;
            box-shadow: 0 2px 8px rgba(232, 63, 137, 0.2);
        }

        .brand-icon {
            font-size: 25px;
        }


        /* MAIN */

        .main {

            width: min(100%, 700px);

            margin: auto;

            padding: 28px 18px;
        }


        .page-title {

            font-size: 28px;

            color: #e83f89;

            margin-bottom: 5px;
        }


        .page-subtitle {

            color: #856579;

            font-size: 14px;

            margin-bottom: 25px;
        }


        /* CHAT CARD */

        .chat-card {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 14px;

            margin-bottom: 12px;

            background: rgba(255,255,255,0.9);

            border: 1px solid #f6d4e4;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(232,63,137,0.07);

            text-decoration: none;

            color: inherit;

            transition: 0.25s;
        }


        .chat-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(232,63,137,0.14);
        }


        .avatar {

            width: 62px;

            height: 62px;

            border-radius: 50%;

            overflow: hidden;

            flex-shrink: 0;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e8,
                    #fff1f7
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;
        }


        .avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .chat-info {

            flex: 1;
        }


        .name-row {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 4px;
        }


        .name {

            font-size: 17px;

            font-weight: 800;
        }


        .age {

            font-size: 11px;

            color: #a1778d;
        }


        .status {

            font-size: 11px;

            color: #2e9b62;

            margin-bottom: 5px;
        }


        .description {

            font-size: 12px;

            color: #856579;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .arrow {

            font-size: 22px;

            color: #e83f89;
        }


        /* BOTTOM NAV */

        .bottom-nav {

            position: fixed;

            bottom: 0;

            left: 0;

            width: 100%;

            height: 65px;

            display: flex;

            justify-content: space-around;

            align-items: center;

            background: rgba(255,255,255,0.94);

            backdrop-filter: blur(18px);

            border-top: 1px solid #f4d3e1;

            z-index: 20;
        }


        .nav-item {

            text-align: center;

            color: #a1778d;

            font-size: 11px;

            text-decoration: none;

            font-weight: 600;
        }


        .nav-icon {

            display: block;

            font-size: 21px;

            margin-bottom: 2px;
        }


        .nav-item.active {

            color: #e83f89;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                height: 64px;
                padding: 0 15px;
            }

            .brand {
                font-size: 16px;
            }

            .main {
                padding: 24px 14px 90px;
            }

            .page-title {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="brand">
        <img src="/static/images/datevibe-logo.png" 
             alt="DateVibe" 
             class="brand-logo"
             onerror="this.style.display='none'; this.parentElement.innerHTML='💗 DateVibe'">
        <span>DateVibe</span>
    </div>

</header>


<!-- MAIN -->

<main class="main">


    <h1 class="page-title">
        💬 Your Chats
    </h1>


    <p class="page-subtitle">
        Continue a conversation or meet someone new. 💗
    </p>


    <!-- AI COMPANIONS -->

    <section>

        <a th:each="profile : ${profiles}"
           th:href="@{'/chat/' + ${profile.id}}"
           class="chat-card">


            <!-- AVATAR -->

            <div class="avatar">

                <img
                    th:if="${profile.profileImage != null
                             and !profile.profileImage.isEmpty()}"
                    th:src="@{'/api/image/' + ${profile.profileImage}}"
                    th:alt="${profile.name}"
                    onerror="this.parentElement.innerHTML='👩'">

                <span
                    th:unless="${profile.profileImage != null
                                and !profile.profileImage.isEmpty()}">

                    👩

                </span>

            </div>


            <!-- INFO -->

            <div class="chat-info">

                <div class="name-row">

                    <span class="name"
                          th:text="${profile.name}">
                        Sofia
                    </span>

                    <span class="age"
                          th:text="${profile.age}">
                        24
                    </span>

                </div>


                <div class="status"
                     th:if="${profile.online}">

                    🟢 Online

                </div>


                <div class="status"
                     th:unless="${profile.online}">

                    ⚪ Offline

                </div>


                <div class="description"
                     th:text="${profile.description}">

                    Start a conversation...

                </div>

            </div>


            <div class="arrow">
                ›
            </div>


        </a>

    </section>


</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">


    <!-- HOME -->

    <a href="/home"
       class="nav-item">

        <span class="nav-icon">
            🏠
        </span>

        Home

    </a>


    <!-- CHATS -->

    <a href="/chats"
       class="nav-item active">

        <span class="nav-icon">
            💬
        </span>

        Chats

    </a>


    <!-- COINS -->

    <a href="/coins"
       class="nav-item">

        <span class="nav-icon">
            🪙
        </span>

        Coins

    </a>


    <!-- PROFILE -->

    <a href="/user-profile"
       class="nav-item">

        <span class="nav-icon">
            👤
        </span>

        Profile

    </a>


</nav>


</body>

</html>
