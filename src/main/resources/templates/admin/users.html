<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Deedi Admin - Users</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #ff82bd,
                    #160912 60%
                );

            color: white;
            min-height: 100vh;
        }

        .header {

            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(0,0,0,0.25);

            backdrop-filter: blur(15px);

        }

        .title {

            font-size: 24px;
            font-weight: bold;
            color: #ff72b6;

        }

        .back {

            color: white;
            text-decoration: none;

            padding: 10px 16px;

            border-radius: 10px;

            background:
                rgba(255,70,150,0.25);

        }

        .container {

            padding: 30px;

            max-width: 1200px;

            margin: auto;

        }

        .page-title {

            font-size: 28px;
            margin-bottom: 25px;

            color: #ff91c7;

        }

        .user-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;

        }

        .user-card {

            padding: 22px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.20);

            backdrop-filter: blur(15px);

            box-shadow:
                0 0 25px
                rgba(255,50,150,0.15);

            transition: 0.25s;

        }

        .user-card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 0 35px
                rgba(255,50,150,0.30);

        }

        .user-name {

            font-size: 21px;

            font-weight: bold;

            color: #ff91c7;

            margin-bottom: 15px;

        }

        .info {

            margin: 9px 0;

            color: #ddd;

        }

        .info strong {

            color: white;

        }

        .payment-paid {

            color: #7CFFB2;

            font-weight: bold;

        }

        .payment-unpaid {

            color: #ff8c8c;

            font-weight: bold;

        }

        .details {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 16px;

            border-radius: 10px;

            background:
                rgba(255,70,150,0.25);

            color: white;

            text-decoration: none;

            transition: 0.2s;

        }

        .details:hover {

            background:
                rgba(255,70,150,0.45);

        }

        .empty {

            text-align: center;

            padding: 40px;

            color: #ccc;

        }

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .title {
                font-size: 20px;
            }

        }

    </style>

</head>

<body>

<header class="header">

    <div class="title">
        DEEDI ADMIN
    </div>

    <a href="/admin/dashboard" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="page-title">
        👥 Users
    </div>


    <div class="user-grid"
         th:if="${!users.isEmpty()}">

        <div class="user-card"
             th:each="user : ${users}">

            <div class="user-name"
                 th:text="${user.name}">
                User Name
            </div>

            <div class="info">

                🎂 Age:
                <strong th:text="${user.age}">
                    20
                </strong>

            </div>

            <div class="info">

                📅 Joined:
     <strong
    	th:text="${user.createdAt != null
        ? #temporals.format(user.createdAt, 'dd MMM yyyy, hh:mm a')
        : 'Before tracking'}">
    	Before tracking
	</strong>

            </div>

<div class="info">

    💰 Payment:

    <strong
        th:class="${paidStatusMap[user.id]} ? 'payment-paid' : 'payment-unpaid'"
        th:text="${paidStatusMap[user.id]} ? 'PAID' : 'NOT PAID'">

        NOT PAID

    </strong>

</div>


<div class="info"
     th:if="${paidStatusMap[user.id]}">

    💵 Total Paid:

    <strong>

        ₹<span th:text="${totalPaidMap[user.id]}">
            0
        </span>

    </strong>

</div>

            <a th:href="@{'/admin/users/' + ${user.id}}"
               class="details">

                View Payment Details →

            </a>

        </div>

    </div>


    <div class="empty"
         th:if="${users.isEmpty()}">

        No users registered yet.

    </div>

</div>

</body>

</html>
