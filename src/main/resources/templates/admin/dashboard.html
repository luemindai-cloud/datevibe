<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Deedi Admin </title>

    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #ff82bd,
                    #160912 60%
                );

            color: white;

            min-height: 100vh;
        }

        .header {

            padding: 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(0,0,0,0.25);

            backdrop-filter: blur(15px);
        }

        .title {

            font-size: 24px;

            font-weight: bold;

            color: #ff72b6;
        }

        .logout {

            color: white;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 10px;

            background:
                rgba(255,70,150,0.25);
        }

        .container {

            padding: 30px;

            max-width: 1200px;

            margin: auto;
        }

        .welcome {

            margin-bottom: 30px;

            font-size: 18px;
        }

        .cards {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 20px;
        }

        .card {

            padding: 25px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.20);

            backdrop-filter: blur(15px);

            box-shadow:
                0 0 25px
                rgba(255,50,150,0.15);
        }

        .card h3 {

            margin-top: 0;

            color: #ff91c7;
        }

        .coming {

            color: #ccc;

            font-size: 14px;
        }
        
        .admin-card {
    display: block;

    padding: 25px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.10);

    border:
        1px solid
        rgba(255,255,255,0.20);

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 25px
        rgba(255,50,150,0.15);

    color: white;

    text-decoration: none;

    transition: 0.25s;
}

.admin-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 0 35px
        rgba(255,50,150,0.30);
}

.admin-card h3 {
    color: #ff91c7;
}

.admin-card p {
    color: #ccc;
}

.admin-card span {
    color: #ff72b6;
    font-weight: bold;
}

    </style>

</head>

<body>

<header class="header">

    <div class="title">
        DEEDI ADMIN
    </div>

    <a
        href="/admin/logout"
        class="logout">
        Logout
    </a>

</header>

<div class="container">

    <div class="welcome">

        Welcome,
        <strong th:text="${adminUsername}">
            Admin
        </strong>
        👑

    </div>

    <a href="/admin/users" class="admin-card">

    <h3>👥 Users</h3>

    <p>
        View users, coins and payment information
    </p>

    <span>
        Manage Users →
    </span>

	</a>

<a href="/admin/payments" class="admin-card">

    <h3>💰 Payments</h3>

    <p>
        View all user payments and transactions
    </p>

    <span>
        Manage Payments →
    </span>

</a>

        <a href="/admin/profiles" class="admin-card">

    <h3>🤖 AI Profiles</h3>

    <p>
        Add, edit and manage AI profiles
    </p>

    <span>
        Manage Profiles →
    </span>

</a>

        <div class="card">
            <h3>🎁 Gifts</h3>
            <p class="coming">
                Gift management coming next
            </p>
        </div>

    </div>

</div>

</body>

</html>
