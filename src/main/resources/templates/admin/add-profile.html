<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add AI Profile - Deedi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                radial-gradient(
                    circle at top,
                    #ff82bd,
                    #160912 60%
                );
        }

        .container {

            width: 92%;

            max-width: 650px;

            margin: 40px auto;

            padding: 30px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.20);

            backdrop-filter: blur(20px);

            box-shadow:
                0 0 35px
                rgba(255,50,150,0.20);
        }

        h1 {

            text-align: center;

            color: #ff72b6;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #eee;
        }

        input,
        textarea {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.25);

            background:
                rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-size: 15px;
        }

        textarea {

            min-height: 100px;

            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {

            color: #aaa;
        }

        /* FILE INPUT */

        input[type="file"] {

            padding: 10px;

            background:
                rgba(255,255,255,0.08);

            cursor: pointer;
        }


        /* FILE BOX */

        .upload-box {

            padding: 18px;

            margin-bottom: 20px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px dashed
                rgba(255,145,199,0.5);
        }

        .upload-title {

            color: #ff91c7;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .upload-info {

            font-size: 12px;

            color: #aaa;

            margin-top: -8px;

            margin-bottom: 12px;
        }


        /* CHECKBOX */

        .checkbox {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;
        }

        .checkbox input {

            width: auto;

            margin: 0;
        }


        /* BUTTON */

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff4fa3,
                    #ff8bca
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px
                rgba(255,70,160,0.25);
        }

        button:hover {

            transform: translateY(-1px);
        }


        /* ERROR */

        .error {

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 12px;

            background:
                rgba(255,50,80,0.15);

            border:
                1px solid
                rgba(255,80,100,0.3);

            color: #ff9aaa;

            text-align: center;
        }


        /* BACK */

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #ff91c7;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        🤖 Add AI Profile
    </h1>


    <!-- ERROR MESSAGE -->

    <div
        class="error"
        th:if="${error}"
        th:text="${error}">
    </div>


    <form
        action="/admin/profiles/add"
        method="post"
        enctype="multipart/form-data">


        <!-- NAME -->

        <label>
            Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Example: Aisha"
            required>


        <!-- AGE -->

        <label>
            Age
        </label>

        <input
            type="number"
            name="age"
            min="18"
            max="100"
            placeholder="23"
            required>


        <!-- DESCRIPTION -->

        <label>
            Description
        </label>

        <textarea
            name="description"
            placeholder="Sweet, friendly and loves conversations..."
            required></textarea>


        <!-- PERSONALITY -->

        <label>
            Personality
        </label>

        <textarea
            name="personality"
            placeholder="Cute and playful"
            required></textarea>


        <!-- IMAGE -->

        <div class="upload-box">

            <div class="upload-title">
                📷 Profile Image
            </div>

            <div class="upload-info">
                Select the AI profile photo from your computer.
            </div>

            <input
                type="file"
                name="profileImage"
                accept="image/*"
                required>

        </div>


        <!-- VIDEO -->

        <div class="upload-box">

            <div class="upload-title">
                🎥 AI Video
            </div>

            <div class="upload-info">
                Select the recorded AI video from your computer.
            </div>

            <input
                type="file"
                name="videoFile"
                accept="video/*"
                required>

        </div>


        <!-- ONLINE -->

        <div class="checkbox">

            <input
                type="checkbox"
                name="online"
                value="true"
                checked>

            <label>
                Online
            </label>

        </div>


        <!-- SUBMIT -->

        <button type="submit">

            ➕ Upload & Add AI Profile

        </button>

    </form>


    <a
        href="/admin/profiles"
        class="back">

        ← Back to AI Profiles

    </a>

</div>

</body>

</html>
