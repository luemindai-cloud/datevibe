<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${profile.name} + ' | Video Call'">
        Video Call
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(255, 105, 180, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 90%,
                    rgba(255, 220, 80, 0.15),
                    transparent 35%
                ),
                #fff8fc;

            color: #3a2030;

            display: flex;
            flex-direction: column;

        }

        /* HEADER */

        .header {

            height: 68px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            background: rgba(255,255,255,0.9);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid #f3d6e4;

            flex-shrink: 0;

        }

        .back {

            text-decoration: none;

            color: #e83f89;

            font-size: 27px;

            font-weight: 700;

        }

        .profile-info {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

        }

        .avatar {

            width: 40px;
            height: 40px;

            border-radius: 50%;

            overflow: hidden;

            background: #ffd9e9;

        }

        .avatar img {

            width: 100%;
            height: 100%;

            object-fit: cover;

        }

        .avatar-placeholder {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

        }

        .name {

            font-size: 15px;

            font-weight: 800;

            color: #d9347d;

        }

        .status {

            font-size: 10px;

            color: #2e9b62;

        }

        .coin-box {

            padding: 8px 12px;

            border-radius: 20px;

            background: #fff4bd;

            color: #806500;

            font-size: 12px;

            font-weight: 800;

        }

        /* VIDEO */

        .video-container {

            flex: 1;

            padding: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .video-card {

            width: 100%;

            max-width: 700px;

            height: min(78vh, 650px);

            border-radius: 28px;

            overflow: hidden;

            position: relative;

            background: #180b13;

            box-shadow:
                0 20px 55px rgba(220, 60, 130, 0.20);

        }

        .video-card video {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }

        /* VIDEO TOP STATUS */

        .video-status {

            position: absolute;

            top: 15px;

            left: 15px;

            padding: 8px 12px;

            border-radius: 20px;

            background: rgba(0,0,0,0.55);

            color: white;

            font-size: 11px;

            font-weight: 700;

            backdrop-filter: blur(8px);

        }

        .live-dot {

            color: #ff4d91;

        }

        /* TIMER */

        .timer {

            position: absolute;

            top: 15px;

            right: 15px;

            padding: 8px 12px;

            border-radius: 20px;

            background: rgba(0,0,0,0.55);

            color: white;

            font-size: 12px;

            font-weight: 800;

            backdrop-filter: blur(8px);

        }

        /* BOTTOM CONTROLS */

        .controls {

            position: absolute;

            bottom: 20px;

            left: 0;

            right: 0;

            display: flex;

            justify-content: center;

        }

        .end-call {

            width: 64px;

            height: 64px;

            border: none;

            border-radius: 50%;

            background: #ff3f91;

            color: white;

            font-size: 25px;

            cursor: pointer;

            box-shadow:
                0 10px 30px rgba(255,63,145,0.40);

        }

        .end-call:active {

            transform: scale(0.94);

        }

        /* INFO */

        .call-info {

            text-align: center;

            padding: 0 15px 20px;

        }

        .call-info-title {

            font-size: 14px;

            font-weight: 800;

            color: #d9347d;

        }

        .call-info-text {

            margin-top: 5px;

            font-size: 11px;

            color: #8b6b7c;

        }

        @media (max-width: 600px) {

            .video-container {

                padding: 10px;

            }

            .video-card {

                height: 72vh;

                border-radius: 23px;

            }

            .end-call {

                width: 58px;

                height: 58px;

            }

        }
        
        .ai-disclosure {
    position: absolute;
    left: 15px;
    bottom: 15px;
    padding: 7px 11px;
    border-radius: 16px;
    background: rgba(0,0,0,0.48);
    color: white;
    font-size: 10px;
    backdrop-filter: blur(8px);
}

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a th:href="@{'/profile/' + ${profile.id}}"
           class="back">

            ←

        </a>

        <div class="profile-info">

            <div class="avatar">

                <img
                    th:if="${profile.profileImage != null and !profile.profileImage.isEmpty()}"
                    th:src="@{'/api/image/' + ${profile.profileImage}}"
                    th:alt="${profile.name}"
                    onerror="this.parentElement.innerHTML='👩'">

                <div
                    th:unless="${profile.profileImage != null and !profile.profileImage.isEmpty()}"
                    class="avatar-placeholder">

                    👩

                </div>

            </div>

            <div>

                <div class="name"
                     th:text="${profile.name}">

                    Sofia

                </div>

                <div class="status">

                    🟢 Video Call

                </div>

            </div>

        </div>

        <div class="coin-box">

            🪙 <span id="coinBalance">0</span>

        </div>

    </header>


    <!-- VIDEO -->

    <main class="video-container">

        <div class="video-card">

            <!--

                WE WILL CONNECT THE REAL RECORDED VIDEO HERE.

            -->

<video id="aiVideo"
       th:src="@{'/api/video/' + ${profile.videoFile}}"
       autoplay
       muted
       playsinline
       loop>
</video>

<div class="ai-disclosure">
    ✨your Companion • 
</div>

            <div class="video-status">

                <span class="live-dot">●</span>

                Connected

            </div>

            <div class="timer"
                 id="callTimer">

                00:00

            </div>

            <div class="controls">

                <button
                    class="end-call"
                    onclick="endCall()">

                    📞

                </button>

            </div>

        </div>

    </main>


    <!-- INFO -->

    <section class="call-info">

        <div class="call-info-title">

            💗 Talking with
            <span th:text="${profile.name}">
                Sofia
            </span>

        </div>

        <div class="call-info-text">

            🪙 1,500 coins per minute

        </div>

    </section>

<div th:replace="~{fragments/recharge-popup :: rechargePopup}"></div>

    <script>

    let seconds = 0;
    let timerInterval;
    let billingInterval;

    const sessionId =
        new URLSearchParams(window.location.search)
            .get("sessionId");

    console.log("🎥 Video call session:", sessionId);

    if (!sessionId) {

        console.error("❌ No video call session found.");

        alert("Invalid video call session.");

        window.location.href =
            "/profile/[[${profile.id}]]";
    }


    // -----------------------------
    // CALL TIMER
    // -----------------------------

    function startTimer() {

        timerInterval = setInterval(function() {

            seconds++;

            const minutes =
                Math.floor(seconds / 60);

            const remainingSeconds =
                seconds % 60;

            document.getElementById("callTimer")
                .innerText =
                String(minutes).padStart(2, "0")
                + ":"
                +
                String(remainingSeconds).padStart(2, "0");

        }, 1000);
    }


    // -----------------------------
    // MINUTE BILLING
    // -----------------------------

    function startBilling() {

        billingInterval = setInterval(
            chargeNextMinute,
            60000
        );
    }


    async function chargeNextMinute() {

        if (!sessionId) {
            return;
        }

        console.log("⏱️ Checking next video-call minute...");

        try {

            const response = await fetch(
                "/api/video-call/minute/" + sessionId,
                {
                    method: "POST"
                }
            );

            const data =
                await response.json();

            console.log(
                "🪙 Billing response:",
                data
            );


            // Server says call should end
            if (!data.success) {

                console.log(
                    "🛑 Video call ending:",
                    data.error
                );

                endVideoCallBecauseNoCoins();

                return;
            }


            // New minute successfully charged
if (data.charged) {

    console.log(
        "🪙 1,500 coins charged."
    );

    console.log(
        "Remaining coins:",
        data.coins
    );

    const coinBalance =
        document.getElementById("coinBalance");

    if (coinBalance) {
        coinBalance.innerText =
            data.coins.toLocaleString();
    }
}
        } catch (error) {

            console.error(
                "❌ Billing request failed:",
                error
            );

        }
    }


    // -----------------------------
    // END CALL - NO COINS
    // -----------------------------

    function endVideoCallBecauseNoCoins() {

        clearInterval(timerInterval);
        clearInterval(billingInterval);

        const video =
            document.getElementById("aiVideo");

        if (video) {
            video.pause();
        }

        const balanceElement =
            document.getElementById("popupCoinBalance");

        if (balanceElement) {

            balanceElement.innerText =
                "0";
        }

        openRechargePopup();
    }


    // -----------------------------
    // NORMAL END CALL
    // -----------------------------

    function endCall() {

        clearInterval(timerInterval);
        clearInterval(billingInterval);

        window.location.href =
            "/profile/[[${profile.id}]]";
    }


    // -----------------------------
    // START
    // -----------------------------

    loadCoinBalance();
    startTimer();
    startBilling();

    console.log(
        "🪙 Video call billing: 1,500 coins/minute"
    );


 
    async function loadCoinBalance() {

        try {

            const response = await fetch("/api/user/coins");

            const data = await response.json();

            console.log("🪙 Current coin balance:", data);

            if (data.loggedIn) {

                const coinBalance =
                    document.getElementById("coinBalance");

                if (coinBalance) {
                    coinBalance.innerText =
                        data.coins.toLocaleString();
                }

            }

        } catch (error) {

            console.error(
                "❌ Failed to load coin balance:",
                error
            );
        }
    }
    
    
    </script>

</body>

</html>
