spring.application.name=ai-video-chat

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_video_chat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Devan1234@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# UPI Payment Gateway Settings
payment.upi.id=${PAYMENT_UPI_ID:deedi@upi}
payment.upi.name=${PAYMENT_UPI_NAME:DEEDI AI}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB
