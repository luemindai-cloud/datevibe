<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Deedi</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 105, 180, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(255, 220, 80, 0.14),
                    transparent 30%
                ),
                #fff8fc;

            color: #3a2030;
            padding-bottom: 90px;
        }


        /* HEADER */

        .header {
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid #f5d5e4;

            position: sticky;
            top: 0;
            z-index: 10;
        }


        .back {
            text-decoration: none;

            color: #e83f89;

            font-size: 25px;
            font-weight: 700;
        }


        .brand {
            font-size: 18px;
            font-weight: 800;
            color: #e83f89;
        }


        .coin-box {
            padding: 9px 14px;

            border-radius: 20px;

            background: #fff4bd;

            color: #806500;

            font-size: 13px;
            font-weight: 800;
        }


        /* MAIN */

        .container {
            width: min(100%, 650px);

            margin: auto;

            padding: 30px 18px;
        }


        .title {
            text-align: center;

            font-size: 29px;

            color: #e83f89;

            margin-bottom: 8px;

            animation: slideUp 0.5s ease;
        }


        .subtitle {
            text-align: center;

            color: #856579;

            font-size: 14px;

            margin-bottom: 25px;

            animation: slideUp 0.7s ease;
        }


        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* PROFILE CARD */

        .profile-card {

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #fff7fb
                );

            border: 1px solid #f5cddd;

            border-radius: 28px;

            padding: 28px 20px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(232,63,137,0.10);

            animation: cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* AVATAR */

        .avatar {

            width: 95px;
            height: 95px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e8,
                    #fff0f7
                );

            border: 3px solid #f7c5da;

            box-shadow:
                0 10px 25px rgba(232,63,137,0.15);
        }


        .user-name {

            font-size: 27px;

            font-weight: 800;

            color: #e83f89;

            margin-bottom: 5px;
        }


        .user-age {

            color: #947183;

            font-size: 14px;

            margin-bottom: 22px;
        }


        /* STATS */

        .stats {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-bottom: 22px;
        }


        .stat {

            padding: 18px 10px;

            border-radius: 18px;

            background: #fff8fc;

            border: 1px solid #f5d7e4;
        }


        .stat-icon {

            font-size: 25px;

            margin-bottom: 5px;
        }


        .stat-value {

            font-size: 20px;

            font-weight: 900;

            color: #e83f89;
        }


        .stat-label {

            font-size: 11px;

            color: #947183;

            margin-top: 3px;
        }


        /* BUTTONS */

        .buttons {

            display: grid;

            gap: 12px;
        }


        .profile-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 16px;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.25s;
        }


        .profile-btn:hover {
            transform: translateY(-3px);
        }


        .recharge-btn {

            background:
                linear-gradient(
                    135deg,
                    #ff3f91,
                    #ff78b4
                );

            color: white;

            box-shadow:
                0 8px 20px rgba(255,63,145,0.22);
        }


        .edit-btn {

            background: #fff4bd;

            color: #806500;
        }


        .logout-btn {

            background: #fff0f5;

            color: #d7357b;

            border: 1px solid #f3cede;
        }


        /* NOTICE */

        .notice {

            margin-top: 18px;

            padding: 14px;

            border-radius: 16px;

            background: rgba(255,255,255,0.8);

            border: 1px solid #f4d9e5;

            color: #886b7a;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;
        }


        /* BOTTOM NAV */

        .bottom-nav {

            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;

            height: 65px;

            display: flex;

            justify-content: space-around;

            align-items: center;

            background: rgba(255,255,255,0.94);

            backdrop-filter: blur(18px);

            border-top: 1px solid #f4d3e1;

            z-index: 20;
        }


        .nav-item {

            text-align: center;

            color: #a1778d;

            font-size: 11px;

            text-decoration: none;

            font-weight: 600;
        }


        .nav-icon {

            display: block;

            font-size: 21px;

            margin-bottom: 2px;
        }


        .nav-item.active {
            color: #e83f89;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                height: 64px;
                padding: 0 15px;
            }

            .container {
                padding: 25px 14px 90px;
            }

            .title {
                font-size: 26px;
            }

            .profile-card {
                padding: 25px 16px;
            }

        }


        @media (max-width: 360px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <a href="/home"
       class="back">
        ←
    </a>

    <div class="brand">
        💗 Deedi
    </div>

    <div class="coin-box">
        🪙
        <span id="profileCoinBalance">
            <span th:text="${user.coins}">0</span>
        </span>
        Coins
    </div>

</header>



<!-- MAIN -->

<main class="container">


    <h1 class="title">
        👤 My Profile
    </h1>


    <p class="subtitle">
        Your Deedi account
    </p>



    <!-- PROFILE CARD -->

    <div class="profile-card">


        <!-- AVATAR -->

        <div class="avatar">
            👤
        </div>


        <!-- NAME -->

        <div class="user-name"
             th:text="${user.name}">
            User
        </div>


        <!-- AGE -->

        <div class="user-age">

            🎂

            <span th:text="${user.age}">
                24
            </span>

            years old

        </div>



        <!-- STATS -->

        <div class="stats">


            <div class="stat">

                <div class="stat-icon">
                    🪙
                </div>

                <div class="stat-value"
                     id="mainCoinBalance"
                     th:text="${user.coins}">
                    0
                </div>

                <div class="stat-label">
                    Coins Balance
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    💬
                </div>

                <div class="stat-value">
                    Deedi
                </div>

                <div class="stat-label">
                    Companion
                </div>

            </div>


        </div>



        <!-- BUTTONS -->

        <div class="buttons">


            <a href="/coins"
               class="profile-btn recharge-btn">

                🪙 RECHARGE COINS

            </a>


            <button class="profile-btn edit-btn"
                    onclick="editProfile()">

                ✏️ EDIT PROFILE

            </button>


            <button class="profile-btn logout-btn"
                    onclick="logoutUser()">

                🚪 LOG OUT

            </button>


        </div>



        <!-- NOTICE -->

        <div class="notice">

            💗 Your profile information is securely connected
            to your Deedi account.

        </div>


    </div>


</main>



<!-- BOTTOM NAV -->

<nav class="bottom-nav">


    <a href="/home"
       class="nav-item">

        <span class="nav-icon">
            🏠
        </span>

        Home

    </a>



    <a href="/chats"
       class="nav-item">

        <span class="nav-icon">
            💬
        </span>

        Chats

    </a>



    <a href="/coins"
       class="nav-item">

        <span class="nav-icon">
            🪙
        </span>

        Coins

    </a>



    <a href="/user-profile"
       class="nav-item active">

        <span class="nav-icon">
            👤
        </span>

        Profile

    </a>


</nav>



<script>


/* LOAD CURRENT COINS */

async function loadProfileCoins() {

    try {

        const response =
            await fetch("/api/user/coins");

        const data =
            await response.json();

        console.log(
            "🪙 Profile coins:",
            data
        );


        if (data.loggedIn) {

            const formattedCoins =
                data.coins.toLocaleString();


            const headerBalance =
                document.getElementById(
                    "profileCoinBalance"
                );

            if (headerBalance) {

                headerBalance.innerText =
                    formattedCoins;

            }


            const mainBalance =
                document.getElementById(
                    "mainCoinBalance"
                );

            if (mainBalance) {

                mainBalance.innerText =
                    formattedCoins;

            }

        }

    } catch (error) {

        console.error(
            "❌ Failed to load profile coins:",
            error
        );

    }

}


loadProfileCoins();



/* EDIT PROFILE */

function editProfile() {

    alert(
        "Edit Profile will be added next bro 😎"
    );

}



/* LOGOUT */

function logoutUser() {

    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if (confirmLogout) {

        window.location.href =
            "/logout";

    }

}

</script>


</body>

</html>
